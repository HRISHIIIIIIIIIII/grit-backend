[project]
name = "grit-backend"
version = "0.1.0"
description = "GRIT — discipline & progress-tracking platform backend (FastAPI + Celery)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-jose>=3.3",
    "types-passlib>=1.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

# Note: the flake8-type-checking (TC) rules are intentionally excluded — SQLAlchemy 2.0
# resolves Mapped[...] annotations at runtime, so date/datetime imports must stay imported.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "UP042",  # keep explicit (str, Enum) mixin for predictable SQLAlchemy storage
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false  # FastAPI/Celery decorators are untyped

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
