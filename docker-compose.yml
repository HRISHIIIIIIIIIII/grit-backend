services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: grit
      POSTGRES_DB: grit
    ports:
      - "5432:5432"
    volumes:
      - grit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      GRIT_DATABASE_URL: postgresql+asyncpg://grit:grit@postgres:5432/grit
      GRIT_SYNC_DATABASE_URL: postgresql+psycopg://grit:grit@postgres:5432/grit
      GRIT_CELERY_BROKER_URL: redis://redis:6379/1
      GRIT_CELERY_RESULT_BACKEND: redis://redis:6379/2
      GRIT_REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      GRIT_SYNC_DATABASE_URL: postgresql+psycopg://grit:grit@postgres:5432/grit
      GRIT_CELERY_BROKER_URL: redis://redis:6379/1
      GRIT_CELERY_RESULT_BACKEND: redis://redis:6379/2
      GRIT_REDIS_URL: redis://redis:6379/0
    command: uv run celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    environment:
      GRIT_SYNC_DATABASE_URL: postgresql+psycopg://grit:grit@postgres:5432/grit
      GRIT_CELERY_BROKER_URL: redis://redis:6379/1
      GRIT_CELERY_RESULT_BACKEND: redis://redis:6379/2
      GRIT_REDIS_URL: redis://redis:6379/0
    command: uv run celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis

volumes:
  grit_pgdata:
